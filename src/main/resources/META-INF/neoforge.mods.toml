modLoader="javafml"
loaderVersion="${loader_range}"
license="All Rights Reserved"

[[mods]]
modId="redstone_exoframes"
version="${version}"
displayName="Redstone Exoframes"
authors="ToxinEren"
description='''Power armor originale: telaio, celle di redstone, moduli e stazione di manutenzione.'''
logoFile="icon.png"

# Mixin solo client (la configurazione li elenca nella sezione "client"): vedi docs/compat.md, "Mixin client".
[[mixins]]
config="redstone_exoframes.mixins.json"

[[dependencies.redstone_exoframes]]
modId="neoforge"
type="required"
versionRange="${neoforge_range}"
ordering="NONE"
side="BOTH"

[[dependencies.redstone_exoframes]]
modId="minecraft"
type="required"
versionRange="${mc_range}"
ordering="NONE"
side="BOTH"

[[dependencies.redstone_exoframes]]
modId="architectury"
type="required"
versionRange="[${architectury_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.redstone_exoframes]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},)"
ordering="AFTER"
side="BOTH"
