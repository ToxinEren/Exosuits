name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Test del core sulle quattro varianti
        run: ./gradlew --no-daemon --console=plain :1.20.1-forge:test :1.20.1-fabric:test :1.21.1-fabric:test :1.21.1-neoforge:test
      - name: Build dei quattro jar
        run: ./gradlew --no-daemon --console=plain :1.20.1-forge:build :1.20.1-fabric:build :1.21.1-fabric:build :1.21.1-neoforge:build :1.20.1-forge:collectJar :1.20.1-fabric:collectJar :1.21.1-fabric:collectJar :1.21.1-neoforge:collectJar
      - name: Test in gioco (GameTest) sulle quattro varianti
        timeout-minutes: 20
        # Passa solo con uscita 0 e "All N required tests passed" con N > 0 per ogni variante.
        run: bash tools/run_gametests.sh
      - name: Controlli sui sorgenti
        run: bash tools/check_sources.sh
      - name: Controlli sui jar
        run: bash tools/check_jars.sh
      - uses: actions/upload-artifact@v5
        with:
          name: redstone-exoframes-jars
          path: build/libs/all/*.jar
          if-no-files-found: error
