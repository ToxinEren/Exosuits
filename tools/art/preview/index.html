<!doctype html>
<html><head><meta charset="utf-8"><title>Anteprima exoframe</title>
<style>html,body{margin:0;background:#7c8088;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/three.module.js"}}</script>
</head><body>
<script type="module">
// Visore: legge direttamente il .geo.json e l'atlante (serviti da render.js come /model/geo.json e
// /model/texture.png) e li costruisce con la matematica di GeckoLib (geo.js). Parametri: view, mannequin=0|1,
// pose=<osso>:<rx>,<ry>,<rz>;... (rotazioni aggiuntive in gradi), fit=suit|model.
import * as THREE from 'three';
import { bakeGeo } from '/geo.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'front';
const mannequin = q.get('mannequin') === '1';
const pose = {};
for (const part of (q.get('pose') || '').split(';').filter(Boolean)) {
  const [name, r] = part.split(':');
  pose[name] = r.split(',').map(Number);
}

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7c8088);

const json = await (await fetch('/model/geo.json')).json();
const tex = await new THREE.TextureLoader().loadAsync('/model/texture.png');
tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false;
tex.colorSpace = THREE.SRGBColorSpace; tex.flipY = false;

const baked = bakeGeo(json, pose);
// texture animate (strisce di fotogrammi verticali, come .png.mcmeta): GeckoLib mostra un fotogramma alla volta;
// qui si usa il primo. Per un atlante non animato vScale vale 1.
const frameHeight = tex.image.width * baked.height / baked.width;
const vScale = frameHeight / tex.image.height;
const pos = [], nor = [], uv = [];
for (const quad of baked.quads) {
  for (const k of [0, 1, 2, 0, 2, 3]) {
    pos.push(...quad.verts[k]); nor.push(...quad.normal);
    uv.push(quad.uvs[k][0] / baked.width, quad.uvs[k][1] / baked.height * vScale);
  }
}
const g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
// come le armature di GeckoLib: ritaglio dell'alfa, nessuna eliminazione delle facce posteriori
const mat = new THREE.MeshLambertMaterial({ map: tex, alphaTest: 0.1, side: THREE.DoubleSide });
scene.add(new THREE.Mesh(g, mat));

// giocatore di riferimento (non fa parte del modello), in coordinate interne (x negata: e' simmetrico)
if (mannequin) {
  const suit = new THREE.MeshLambertMaterial({ color: 0x4a3b33 });
  const skin = new THREE.MeshLambertMaterial({ color: 0xb08a6c });
  const parts = [[[-4, 24, -4], [4, 32, 4], skin], [[-4, 12, -2], [4, 24, 2], suit], [[-8, 12, -2], [-4, 24, 2], suit],
    [[4, 12, -2], [8, 24, 2], suit], [[-4, 0, -2], [0, 12, 2], suit], [[0, 0, -2], [4, 12, 2], suit]];
  for (const [lo, hi, m] of parts) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]), m);
    b.position.set((lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2);
    scene.add(b);
  }
  // occhi, per riconoscere il fronte
  const eye = new THREE.MeshLambertMaterial({ color: 0x2a2a40 });
  for (const x of [-2.5, 2.5]) {
    const e = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.05), eye);
    e.position.set(x, 27.5, -4.03); scene.add(e);
  }
}

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const key = new THREE.DirectionalLight(0xfff4e8, 1.9);
const rim = new THREE.DirectionalLight(0xdde6ff, 0.8);
scene.add(key, rim);

// direzioni della camera in coordinate interne: il fronte guarda verso -z, il lato destro del giocatore e' a +x
const VIEWS = {
  front: [0.55, 0.32, -0.8], back: [-0.55, 0.32, 0.8], side: [1, 0.12, -0.08], left: [-1, 0.12, -0.08],
  front_flat: [0, 0, -1], back_flat: [0, 0, 1], top: [0.0001, 1, -0.35], bottom: [0.3, -1, -0.5],
};
const d = new THREE.Vector3(...(VIEWS[view] || VIEWS.front)).normalize();
key.position.copy(d).add(new THREE.Vector3(0, 1.2, 0)).multiplyScalar(10);
rim.position.set(-d.x, 0.4, -d.z).multiplyScalar(10);

const box = new THREE.Box3();
if (q.get('fit') === 'model') box.setFromObject(scene);
else box.set(new THREE.Vector3(-13, -1, -9), new THREE.Vector3(13, 36, 8));
const center = box.getCenter(new THREE.Vector3());
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
cam.position.copy(center).addScaledVector(d, 200);
cam.up.set(0, 1, 0);
if (Math.abs(d.y) > 0.9) cam.up.set(0, 0, -1);
cam.lookAt(center);
cam.updateMatrixWorld(true);
let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
  const p = new THREE.Vector3(x, y, z).applyMatrix4(cam.matrixWorldInverse);
  minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x); miny = Math.min(miny, p.y); maxy = Math.max(maxy, p.y);
}
const half = Math.max(maxx - minx, maxy - miny) / 2 * 1.04;
const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
Object.assign(cam, { left: cx - half, right: cx + half, top: cy + half, bottom: cy - half });
cam.updateProjectionMatrix();
renderer.render(scene, cam);
window.__ready = true;
</script></body></html>
